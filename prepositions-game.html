<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>位置介系詞大挑戰</title>
  <style>
    * { box-sizing: border-box }
    html, body { width: 100%; height: 100%; margin: 0 }
    body { display: grid; place-items: center; overflow: hidden; background: #102b36; font-family: Arial, "Microsoft JhengHei", sans-serif }
    #board { display: block; width: 100%; height: 100%; max-width: 150vh; touch-action: none; user-select: none }
    .draggable { cursor: grab }
    .draggable:active { cursor: grabbing }
    .action { cursor: pointer }
    .action:hover rect { filter: brightness(1.08) }
    .action:focus-visible, #child:focus-visible { outline: none; filter: drop-shadow(0 0 7px #ffe4a4) }
    #child { touch-action: none }
    @media (max-aspect-ratio: 3/2) { #board { width: 100vw; height: auto; max-height: 100vh } }
    @media (min-aspect-ratio: 3/2) { #board { height: 100vh; width: auto; max-width: 100vw } }
  </style>
</head>
<body>
  <svg id="board" viewBox="0 0 960 640" role="application" aria-label="位置介系詞大挑戰。拖曳小朋友到句子指定的位置；也可用方向鍵或 WASD 移動，按 Enter 確認。">
    <defs>
      <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#163b46"/><stop offset="1" stop-color="#244b50"/>
      </linearGradient>
    </defs>
    <rect width="960" height="640" fill="url(#room)"/>
    <rect x="34" y="18" width="892" height="604" rx="32" fill="#1b3e48"/>
    <ellipse cx="480" cy="490" rx="305" ry="52" fill="#e6c77b"/>
    <ellipse cx="480" cy="490" rx="285" ry="38" fill="none" stroke="#d8b96f" stroke-width="3" opacity=".7"/>
    <rect x="65" y="523" width="830" height="70" rx="18" fill="#254b50"/>
    <circle cx="112" cy="555" r="6" fill="#36616a"/><circle cx="848" cy="555" r="6" fill="#36616a"/>

    <text x="66" y="40" fill="#f4d58b" font-size="18" font-weight="700" letter-spacing="2">LOCATION QUEST</text>
    <text x="66" y="65" fill="#d8e9df" font-size="15">位置介系詞大挑戰</text>
    <text id="progress" x="710" y="50" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">ROUND 1 / 6</text>
    <text id="score" x="860" y="50" fill="#f4d58b" font-size="17" font-weight="700" text-anchor="middle">★ 0</text>

    <rect x="190" y="100" width="580" height="108" rx="22" fill="#f8f4e9"/>
    <circle cx="221" cy="154" r="8" fill="#f1d083"/>
    <text id="prompt" x="480" y="151" fill="#163940" font-size="25" font-weight="700" text-anchor="middle">Put the child between the two suitcases.</text>
    <text id="helper" x="480" y="181" fill="#557071" font-size="15" text-anchor="middle">Drag the child to match the sentence</text>

    <g id="objects">
      <g id="suitcases"></g>
      <g id="child" class="draggable" tabindex="0" role="button" aria-label="可拖曳的小朋友；也可用方向鍵移動，按 Enter 確認">
        <ellipse cx="0" cy="51" rx="46.5" ry="9.5" fill="#183942" opacity=".25"/>
        <circle cx="0" cy="-19" r="27" fill="#e6a15f"/>
        <ellipse cx="0" cy="-39" rx="25.5" ry="12.5" fill="#543a35"/>
        <circle cx="-22" cy="-29" r="12" fill="#543a35"/><circle cx="22" cy="-29" r="12" fill="#543a35"/>
        <circle cx="-9" cy="-19" r="5" fill="#fff"/><circle cx="9" cy="-19" r="5" fill="#fff"/>
        <circle cx="-9" cy="-18" r="2.5" fill="#243c48"/><circle cx="9" cy="-18" r="2.5" fill="#243c48"/>
        <path d="M -7 -11 Q 0 -3 7 -11" fill="none" stroke="#9a4b47" stroke-width="2"/>
        <rect x="-29" y="7" width="58" height="43" rx="13" fill="#4b8c93"/>
        <rect x="-42" y="28" width="84" height="31" rx="8" fill="#f7e6bb"/>
        <rect x="-36" y="33" width="72" height="21" rx="5" fill="#c85e50"/>
        <rect x="-4" y="34" width="8" height="18" rx="2" fill="#f0c870"/>
      </g>
    </g>

    <text id="feedback" x="480" y="522" fill="#fff4d8" font-size="17" font-weight="700" text-anchor="middle" aria-live="polite"></text>

    <g id="hintButton" class="action" tabindex="0" role="button" aria-label="顯示提示">
      <rect x="383" y="543" width="194" height="46" rx="17" fill="#3c6b6d"/>
      <text x="480" y="572" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">Show a hint</text>
    </g>
    <g id="nextButton" class="action" tabindex="0" role="button" aria-label="前往下一題" style="display:none">
      <rect x="738" y="543" width="134" height="46" rx="17" fill="#e2ad4f"/>
      <text id="nextLabel" x="805" y="572" fill="#173941" font-size="16" font-weight="700" text-anchor="middle">Next →</text>
    </g>
  </svg>

  <script>
    (() => {
      'use strict';

      const relations = [
        { word: 'on', sentence: 'Put the child on the suitcase.', meaning: '在……上面', target: 'on' },
        { word: 'under', sentence: 'Put the child under the suitcase.', meaning: '在……下面', target: 'under' },
        { word: 'next to', sentence: 'Put the child next to the suitcase.', meaning: '在……旁邊', target: 'next' },
        { word: 'in front of', sentence: 'Put the child in front of the suitcase.', meaning: '在……前面', target: 'front' },
        { word: 'behind', sentence: 'Put the child behind the suitcase.', meaning: '在……後面', target: 'behind' },
        { word: 'between', sentence: 'Put the child between the two suitcases.', meaning: '在兩個……中間', target: 'between' }
      ];

      const svg = document.getElementById('board');
      const objects = document.getElementById('objects');
      const suitcases = document.getElementById('suitcases');
      const child = document.getElementById('child');
      const prompt = document.getElementById('prompt');
      const helper = document.getElementById('helper');
      const feedback = document.getElementById('feedback');
      const progress = document.getElementById('progress');
      const scoreLabel = document.getElementById('score');
      const hintButton = document.getElementById('hintButton');
      const nextButton = document.getElementById('nextButton');
      const nextLabel = document.getElementById('nextLabel');
      const NS = 'http://www.w3.org/2000/svg';
      const suitcaseTemplate = `
        <ellipse cx="0" cy="68" rx="88" ry="12" fill="#102d35" opacity=".28"/>
        <rect x="-32" y="-87" width="64" height="34" rx="13" fill="none" stroke="#dda842" stroke-width="9"/>
        <rect x="-90" y="-64" width="180" height="128" rx="19" fill="#e5aa46"/>
        <rect x="-75" y="-49" width="150" height="97" rx="13" fill="#f2c86e"/>
        <rect x="-18" y="-10" width="36" height="25" rx="5" fill="#2b5960"/>
        <rect x="-10" y="-6" width="20" height="16" rx="3" fill="#fff0c8"/>
        <circle cy="2" r="3" fill="#2b5960"/>`;

      let deck = [];
      let round = 0;
      let score = 0;
      let tries = 0;
      let locked = false;
      let childX = 480;
      let childY = 475;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let dragging = false;

      function shuffled(items) {
        const result = items.slice();
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function makeSuitcase(x, scale) {
        const group = document.createElementNS(NS, 'g');
        group.setAttribute('transform', `translate(${x} 376) scale(${scale})`);
        group.setAttribute('aria-hidden', 'true');
        group.innerHTML = suitcaseTemplate + '<text x="0" y="39" fill="#684a25" font-size="12" font-weight="700" text-anchor="middle">SUITCASE</text>';
        return group;
      }

      function setChildPosition(x, y) {
        childX = Math.max(115, Math.min(845, x));
        childY = Math.max(245, Math.min(492, y));
        child.setAttribute('transform', `translate(${childX} ${childY})`);
      }

      function renderSuitcases() {
        suitcases.replaceChildren();
        if (deck[round].target === 'between') {
          suitcases.append(makeSuitcase(360, 0.86), makeSuitcase(600, 0.86));
        } else {
          suitcases.append(makeSuitcase(480, 1));
        }
        if (deck[round].target === 'behind') objects.insertBefore(child, suitcases);
        else objects.append(child);
      }

      function showRound() {
        if (round >= deck.length) return finishGame();
        const current = deck[round];
        tries = 0;
        locked = false;
        progress.textContent = `ROUND ${round + 1} / ${deck.length}`;
        scoreLabel.textContent = `★ ${score}`;
        prompt.textContent = current.sentence;
        helper.textContent = 'Drag the child to match the sentence';
        feedback.textContent = '';
        feedback.setAttribute('fill', '#fff4d8');
        setChildPosition(480, 475);
        child.style.display = '';
        hintButton.style.display = '';
        nextLabel.textContent = 'Next →';
        nextButton.setAttribute('aria-label', '前往下一題');
        nextButton.style.display = 'none';
        renderSuitcases();
      }

      function showHint() {
        if (locked) return;
        const current = deck[round];
        helper.textContent = `${current.word}  means  ${current.meaning}`;
      }

      function placementIsCorrect() {
        const target = deck[round].target;
        if (target === 'on') return Math.abs(childX - 480) < 72 && childY < 286;
        if (target === 'under') return Math.abs(childX - 480) < 72 && childY > 445;
        if (target === 'next') return (childX < 335 || childX > 625) && childY > 315 && childY < 435;
        if (target === 'front') return Math.abs(childX - 480) < 72 && childY > 385 && childY < 438;
        if (target === 'behind') return Math.abs(childX - 480) < 72 && childY > 320 && childY < 365;
        return Math.abs(childX - 480) < 38 && childY > 330 && childY < 418;
      }

      function checkPlacement() {
        if (locked) return;
        const current = deck[round];
        if (placementIsCorrect()) {
          locked = true;
          score += Math.max(50, 120 - tries * 20);
          scoreLabel.textContent = `★ ${score}`;
          feedback.setAttribute('fill', '#c6f3c8');
          feedback.textContent = `Correct!  ${current.word}  ${current.meaning}`;
          helper.textContent = 'Great placement. Continue to the next sentence.';
          nextLabel.textContent = 'Next →';
          nextButton.setAttribute('aria-label', '前往下一題');
          nextButton.style.display = '';
        } else {
          tries += 1;
          feedback.setAttribute('fill', '#ffe0a1');
          feedback.textContent = 'Not quite. Try another position!';
          setChildPosition(480, 475);
        }
      }

      function nextRound() {
        if (!locked && round < deck.length) return;
        round += 1;
        showRound();
      }

      function finishGame() {
        locked = true;
        prompt.textContent = 'You did it!';
        helper.textContent = 'You practiced all six prepositions of place.';
        feedback.setAttribute('fill', '#c6f3c8');
        feedback.textContent = `Final score  ${score}`;
        progress.textContent = 'ALL 6 COMPLETE';
        child.style.display = 'none';
        hintButton.style.display = 'none';
        nextLabel.textContent = 'Play again';
        nextButton.setAttribute('aria-label', '再玩一次');
        nextButton.style.display = '';
      }

      function restartGame() {
        deck = shuffled(relations);
        round = 0;
        score = 0;
        showRound();
      }

      function pointInSvg(event) {
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        return point.matrixTransform(svg.getScreenCTM().inverse());
      }

      child.addEventListener('pointerdown', (event) => {
        if (locked) return;
        event.preventDefault();
        const point = pointInSvg(event);
        dragOffsetX = childX - point.x;
        dragOffsetY = childY - point.y;
        dragging = true;
        child.setPointerCapture(event.pointerId);
        child.setAttribute('transform', `translate(${childX} ${childY}) scale(1.06)`);
      });

      child.addEventListener('pointermove', (event) => {
        if (!dragging || locked) return;
        const point = pointInSvg(event);
        setChildPosition(point.x + dragOffsetX, point.y + dragOffsetY);
        child.setAttribute('transform', `translate(${childX} ${childY}) scale(1.06)`);
      });

      child.addEventListener('pointerup', (event) => {
        if (!dragging) return;
        dragging = false;
        if (child.hasPointerCapture(event.pointerId)) child.releasePointerCapture(event.pointerId);
        setChildPosition(childX, childY);
        checkPlacement();
      });
      child.addEventListener('pointercancel', () => {
        dragging = false;
        setChildPosition(childX, childY);
      });
      child.addEventListener('contextmenu', (event) => event.preventDefault());

      child.addEventListener('keydown', (event) => {
        if (locked) return;
        const key = event.key.toLowerCase();
        const step = event.shiftKey ? 40 : 20;
        const directions = {
          arrowup: [0, -step], w: [0, -step],
          arrowdown: [0, step], s: [0, step],
          arrowleft: [-step, 0], a: [-step, 0],
          arrowright: [step, 0], d: [step, 0]
        };
        if (directions[key]) {
          event.preventDefault();
          setChildPosition(childX + directions[key][0], childY + directions[key][1]);
        } else if (key === 'enter' || key === ' ') {
          event.preventDefault();
          checkPlacement();
        }
      });

      function activateOnKeyboard(element, callback) {
        element.addEventListener('click', callback);
        element.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            callback();
          }
        });
      }

      activateOnKeyboard(hintButton, showHint);
      activateOnKeyboard(nextButton, () => {
        if (round >= deck.length) restartGame();
        else nextRound();
      });

      restartGame();
    })();
  </script>
</body>
</html>
